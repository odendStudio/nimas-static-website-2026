name: Deploy Static Website to Production (High-Speed)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Zip & Extract
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📈 Inject Google Analytics
        run: |
          python .github/workflows/inject_analytics.py

      - name: 📦 Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: 🚀 Deploy HTML/CSS/JS via lftp mirror
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:passive-mode true; set ftp:prefer-epsv false; \
            mirror -R . /domains/nimazomorrodi.com/public_html \
              --exclude-glob assets/media/ \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude dynamic_features.md \
              --exclude .gitignore \
              --parallel=4 --verbose; quit" \
            -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"

      - name: 🎬 Upload media files via lftp mirror
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -e "set ssl:verify-certificate no; set ftp:passive-mode true; set ftp:prefer-epsv false; \
            mirror -R assets/media /domains/nimazomorrodi.com/public_html/assets/media \
              --only-newer --parallel=2 --verbose; quit" \
            -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
