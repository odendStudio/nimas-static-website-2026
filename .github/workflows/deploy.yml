name: Deploy Static Website to Production (High-Speed)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via Zip & Extract
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📈 Inject Google Analytics
        run: |
          python .github/workflows/inject_analytics.py

      - name: 📦 Archive site files
        run: |
          zip -r site.zip . -x "*.git*" ".github/*" "dynamic_features.md" ".gitignore"

      - name: 📝 Create unzip trigger script
        run: |
          cat << 'EOF' > unzip.php
          <?php
          @set_time_limit(300);
          $zip_file = __DIR__ . '/site.zip';
          if (!file_exists($zip_file)) {
              die("Error: site.zip not found.");
          }
          $zip = new ZipArchive;
          if ($zip->open($zip_file) === TRUE) {
              $zip->extractTo(__DIR__);
              $zip->close();
              @unlink($zip_file);
              @unlink(__FILE__);
              echo "SUCCESS: Extracted all files and cleaned up.";
          } else {
              echo "Error: Could not open site.zip.";
          }
          ?>
          EOF

      - name: 🚀 Prepare files for upload
        run: |
          mkdir ftp_upload_temp
          mv site.zip ftp_upload_temp/
          mv unzip.php ftp_upload_temp/

      - name: 🚀 Upload Archive via lftp (High-Speed)
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "set ftp:list-options -a; set ftp:passive-mode true; set ftp:prefer-epsv false; open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://${{ secrets.FTP_SERVER }}; put -O /domains/nimazomorrodi.com/public_html ftp_upload_temp/unzip.php; put -O /domains/nimazomorrodi.com/public_html ftp_upload_temp/site.zip"

      - name: ⚡ Trigger Unzip Extraction on Server
        run: |
          echo "Triggering extraction via HTTP..."
          curl --max-time 120 https://nimazomorrodi.com/unzip.php
