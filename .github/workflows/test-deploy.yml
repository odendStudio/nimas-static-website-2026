name: Test Deploy (index only)

on:
  workflow_dispatch:

jobs:
  test:
    name: Upload index.html via FTP
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Upload index.html via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -e "set ssl:verify-certificate no; set ftp:passive-mode true; set ftp:prefer-epsv false; put -O /domains/nimazomorrodi.com/public_html index.html; quit" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          echo "Done"
